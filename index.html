<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmur — 伊藤早苗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

<div class="page">

  <button class="theme-toggle" id="themeToggle" aria-label="テーマ切替" type="button">

  <div class="card">

    <div class="status-bar">
      <span>9:41</span>
      <div class="battery"><div class="battery-fill"></div></div>

    <div class="nav-row">
      <button class="icon-btn" aria-label="戻る" type="button">

      </button>
      <div class="brand">
        <span class="brand-title">Murmur</span>
        <span class="brand-subtitle">プロフィール</span>
      </div>
      <button class="icon-btn" aria-label="その他のオプション" type="button">

        <span class="handle">@sanae.notes</span>
        <span class="badge">編集者</span>

    </div>

    <div class="meta-row">
      <div class="meta-item">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 11s4-3.5 4-6.5A4 4 0 0 0 2 4.5C2 7.5 6 11 6 11Z" stroke="currentColor" stroke-width="1.2"></path><circle cx="6" cy="4.5" r="1.3" stroke="currentColor" stroke-width="1.2"></circle></svg>

      <div class="meta-item link">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M5 7 7 5M4 8a2 2 0 0 1 0-2.8l1.4-1.4a2 2 0 0 1 2.8 2.8L7 7.6M8 4a2 2 0 0 1 0 2.8L6.6 8.2a2 2 0 0 1-2.8-2.8L4.5 4.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg>

    <div class="followed-by-row">
      <div class="avatar-stack">
